
name: Build MN Cut APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract MN Cut project
        run: |
          unzip -q MN_Cut_v30.zip
          ls -la MN_Cut_v29

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Check JavaScript
        run: node --check MN_Cut_v29/app/src/main/assets/app.js

      - name: Build APK
        working-directory: MN_Cut_v29
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MN-Cut-debug-apk
          path: MN_Cut_v29/app/build/outputs/apk/debug/app-debug.apk
          
